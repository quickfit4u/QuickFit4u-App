<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitPass India Admin — Analytics</title>
<link rel="stylesheet" href="shared.css">
<style>
  .chart-card { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 22px; margin-bottom: 24px; }
  .chart-card h2 { font-size: 15px; margin: 0 0 20px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; background: var(--sage); border-radius: 5px 5px 0 0; min-height: 2px; position: relative; }
  .bar:hover { background: var(--sage-dark); }
  .bar-count { font-size: 10.5px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 700; }
  .bar-label { font-size: 10px; color: var(--ink-soft); margin-top: 8px; white-space: nowrap; }
  .top-gym-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .top-gym-row:last-child { border-bottom: none; }
  .top-gym-bar { flex: 1; height: 8px; background: var(--sage-light); border-radius: 4px; margin: 0 16px; overflow: hidden; }
  .top-gym-bar-fill { height: 100%; background: var(--sage-dark); }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
  renderShell('analytics.html');
  setPageTitle('Analytics');

  document.getElementById('mainContent').innerHTML = `
    <div class="chart-card">
      <h2>Bookings — last 14 days</h2>
      <div class="bars" id="bookingsChart"><div class="loading">Loading…</div></div>
    </div>
    <div class="chart-card">
      <h2>New Signups — last 14 days</h2>
      <div class="bars" id="signupsChart"><div class="loading">Loading…</div></div>
    </div>
    <div class="chart-card">
      <h2>Top 5 Gyms by Bookings</h2>
      <div id="topGyms"><div class="loading">Loading…</div></div>
    </div>
  `;

  function buildLast14Days() {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    return days;
  }

  function renderBarChart(containerId, rows) {
    const days = buildLast14Days();
    const byDay = {};
    rows.forEach((r) => { byDay[r.day] = r.count; });
    const max = Math.max(1, ...days.map((d) => byDay[d] || 0));

    document.getElementById(containerId).innerHTML = days
      .map((d) => {
        const count = byDay[d] || 0;
        const heightPct = Math.max(3, Math.round((count / max) * 100));
        const label = new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
        return `
          <div class="bar-wrap">
            <div class="bar-count">${count || ''}</div>
            <div class="bar" style="height:${heightPct}%;" title="${label}: ${count}"></div>
            <div class="bar-label">${label}</div>
          </div>
        `;
      })
      .join('');
  }

  async function load() {
    try {
      const data = await apiRequest('/api/admin/analytics');
      if (!data) return;

      renderBarChart('bookingsChart', data.bookingsByDay);
      renderBarChart('signupsChart', data.signupsByDay);

      const topGymsEl = document.getElementById('topGyms');
      if (data.topGyms.length === 0) {
        topGymsEl.innerHTML = `<div class="loading">No bookings yet.</div>`;
      } else {
        const max = Math.max(...data.topGyms.map((g) => g.bookingCount));
        topGymsEl.innerHTML = data.topGyms
          .map(
            (g) => `
            <div class="top-gym-row">
              <span style="min-width:160px;font-weight:600;font-size:13px;">${escapeHtml(g.name)}</span>
              <div class="top-gym-bar"><div class="top-gym-bar-fill" style="width:${(g.bookingCount / max) * 100}%;"></div></div>
              <span style="font-size:13px;font-weight:700;">${g.bookingCount}</span>
            </div>
          `
          )
          .join('');
      }
    } catch (e) {
      document.getElementById('mainContent').innerHTML = `<div class="error-banner">${escapeHtml(e.message)}</div>`;
    }
  }

  load();
</script>
</body>
</html>
