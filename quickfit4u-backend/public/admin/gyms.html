<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickFit4u Admin — Gym Partners</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="shared.js"></script>
<script>
  renderShell('gyms.html');
  setPageTitle('Gym Partners');

  document.getElementById('mainContent').innerHTML = `
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by gym, city, or owner…">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="live">Live</option>
        <option value="pending">Pending agreement</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>
    <div class="section">
      <div class="scroll-hint">← Scroll sideways to see all columns →</div>
      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Gym</th><th>Owner</th><th>Referral Code</th><th>Location</th><th>Phone</th><th>Price/hr</th>
            <th>Hours</th><th>Facilities</th><th>Photos</th><th>Rating</th><th>Status</th><th>Payout</th><th></th>
          </tr>
        </thead>
        <tbody id="gymsBody"><tr class="empty-row"><td colspan="13" class="loading">Loading…</td></tr></tbody>
      </table>
      </div>
    </div>
  `;

  let debounceTimer;
  const search = document.getElementById('search');
  const statusFilter = document.getElementById('statusFilter');

  async function load() {
    const body = document.getElementById('gymsBody');
    body.innerHTML = `<tr class="empty-row"><td colspan="13" class="loading">Loading…</td></tr>`;
    try {
      const params = new URLSearchParams();
      if (search.value.trim()) params.set('search', search.value.trim());
      if (statusFilter.value) params.set('status', statusFilter.value);

      const data = await apiRequest('/api/admin/gyms?' + params.toString());
      if (!data) return;

      if (data.gyms.length === 0) {
        body.innerHTML = `<tr class="empty-row"><td colspan="13">No gyms match.</td></tr>`;
        return;
      }

      body.innerHTML = data.gyms
        .map(
          (g) => `<tr>
            <td><strong>${escapeHtml(g.name)}</strong></td>
            <td>${escapeHtml(g.ownerName)}<br><span style="color:var(--ink-soft);font-size:11.5px;">${escapeHtml(g.ownerEmail)}</span></td>
            <td>${g.referredBy ? '<span class="pill pill-pending">' + escapeHtml(g.referredBy) + '</span>' : '—'}</td>
            <td>${escapeHtml(g.address || '—')}</td>
            <td>${escapeHtml(g.phone || '—')}</td>
            <td>₹${escapeHtml(g.hourlyRate)}</td>
            <td>${escapeHtml(g.openingHours || '—')}${g.peakHours ? '<br><span style="color:var(--ink-soft);font-size:11px;">Peak: ' + escapeHtml(g.peakHours) + '</span>' : ''}</td>
            <td>${g.facilities.length ? escapeHtml(g.facilities.slice(0, 2).join(', ')) + (g.facilities.length > 2 ? ' +' + (g.facilities.length - 2) : '') : '—'}</td>
            <td>${g.photos.length} photo${g.photos.length === 1 ? '' : 's'}</td>
            <td>${g.rating != null ? '★ ' + g.rating + ' (' + g.reviewCount + ')' : '—'}</td>
            <td><span class="pill pill-${g.status}">${g.status}</span></td>
            <td>
              ${g.bankDetailsOnFile ? '<span class="pill pill-live">on file</span>' : '<span class="pill pill-pending">not set up</span>'}
              ${g.pendingPayoutRupees > 0 ? '<br><span style="font-size:11.5px;">₹' + g.pendingPayoutRupees + ' pending</span>' : ''}
            </td>
            <td>
              <button class="btn ${g.suspended ? 'btn-primary' : 'btn-danger'}" data-id="${g.id}" data-suspend="${g.suspended ? '0' : '1'}">
                ${g.suspended ? 'Unsuspend' : 'Suspend'}
              </button>
            </td>
          </tr>`
        )
        .join('');

      document.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await apiRequest(`/api/admin/gyms/${btn.dataset.id}/suspend`, {
              method: 'PATCH',
              body: { suspended: btn.dataset.suspend === '1' },
            });
            load();
          } catch (e) {
            alert(e.message);
            btn.disabled = false;
          }
        });
      });
    } catch (e) {
      body.innerHTML = `<tr class="empty-row"><td colspan="13">${escapeHtml(e.message)}</td></tr>`;
    }
  }

  search.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(load, 350);
  });
  statusFilter.addEventListener('change', load);

  load();
</script>
</body>
</html>
