<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickFit4u Admin — Complaints</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="shared.js"></script>
<script>
  renderShell('complaints.html');
  setPageTitle('Complaints & Feedback');

  document.getElementById('mainContent').innerHTML = `
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by name, email, or subject…">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="resolved">Resolved</option>
      </select>
      <select id="roleFilter">
        <option value="">Members & owners</option>
        <option value="member">Members only</option>
        <option value="owner">Owners only</option>
      </select>
    </div>
    <div class="section">
      <table>
        <thead><tr><th>From</th><th>Category</th><th>Subject</th><th>Gym</th><th>Status</th><th>Received</th><th></th></tr></thead>
        <tbody id="complaintsBody"><tr class="empty-row"><td colspan="7" class="loading">Loading…</td></tr></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>
  `;

  let page = 1;
  let debounceTimer;
  const search = document.getElementById('search');
  const statusFilter = document.getElementById('statusFilter');
  const roleFilter = document.getElementById('roleFilter');

  function showComplaintModal(c) {
    document.getElementById('complaintModalRoot')?.remove();
    const attachmentsHtml = (c.attachments || []).length
      ? `<div style="margin-top:14px;"><strong>Attachments (${c.attachments.length}):</strong>
           <ul style="padding-left:18px;margin-top:6px;">
             ${c.attachments.map((a) => `<li style="margin-bottom:4px;"><a href="${a.url}" target="_blank" rel="noopener" style="color:var(--sage-dark,#5E7A4E);">${escapeHtml(a.name)}</a></li>`).join('')}
           </ul></div>`
      : '';
    const wrap = document.createElement('div');
    wrap.id = 'complaintModalRoot';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;';
    wrap.innerHTML = `
      <div style="background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <h3 style="margin:0 0 4px;">${escapeHtml(c.subject)}</h3>
          <button id="closeComplaintModal" class="btn btn-ghost" style="padding:4px 10px;">✕</button>
        </div>
        <p style="color:var(--ink-soft,#6B7566);font-size:13px;margin:0 0 10px;">
          ${escapeHtml(c.userName)} &lt;${escapeHtml(c.userEmail)}&gt; · ${c.role} · ${escapeHtml(c.category)}
        </p>
        <div style="white-space:pre-wrap;background:#F5F1E6;padding:14px;border-radius:8px;">${escapeHtml(c.message)}</div>
        ${attachmentsHtml}
        ${c.adminNote ? `<div style="margin-top:14px;"><strong>Admin note</strong><div style="white-space:pre-wrap;">${escapeHtml(c.adminNote)}</div></div>` : ''}
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
    document.getElementById('closeComplaintModal').addEventListener('click', () => wrap.remove());
  }

  function statusPillClass(s) {
    if (s === 'resolved') return 'pill-live';
    if (s === 'in_progress') return 'pill-suspended';
    return 'pill-cancelled';
  }

  async function load() {
    const body = document.getElementById('complaintsBody');
    body.innerHTML = `<tr class="empty-row"><td colspan="7" class="loading">Loading…</td></tr>`;
    try {
      const params = new URLSearchParams({ page });
      if (search.value.trim()) params.set('search', search.value.trim());
      if (statusFilter.value) params.set('status', statusFilter.value);
      if (roleFilter.value) params.set('role', roleFilter.value);

      const data = await apiRequest('/api/admin/complaints?' + params.toString());
      if (!data) return;

      if (data.complaints.length === 0) {
        body.innerHTML = `<tr class="empty-row"><td colspan="7">No complaints match.</td></tr>`;
      } else {
        body.innerHTML = data.complaints
          .map((c) => `
            <tr>
              <td>
                <strong>${escapeHtml(c.userName)}</strong><br>
                <span style="color:var(--ink-soft);font-size:12px;">${escapeHtml(c.userEmail)} · ${c.role}</span>
                ${c.emailSent ? '' : '<br><span style="color:var(--error-text);font-size:11px;">email not sent</span>'}
              </td>
              <td>${escapeHtml(c.category)}</td>
              <td style="max-width:260px;">
                <strong>${escapeHtml(c.subject)}</strong><br>
                <span style="color:var(--ink-soft);font-size:12px;">${escapeHtml((c.message || '').slice(0, 90))}${c.message && c.message.length > 90 ? '…' : ''}</span>
              </td>
              <td>${escapeHtml(c.gymName || '—')}${c.attachments && c.attachments.length ? `<br><span style="color:var(--ink-soft);font-size:11px;">📎 ${c.attachments.length} file${c.attachments.length > 1 ? 's' : ''}</span>` : ''}</td>
              <td>
                <select class="statusSelect" data-id="${c.id}">
                  <option value="open" ${c.status === 'open' ? 'selected' : ''}>Open</option>
                  <option value="in_progress" ${c.status === 'in_progress' ? 'selected' : ''}>In progress</option>
                  <option value="resolved" ${c.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                </select>
              </td>
              <td>${formatDateTime(c.createdAt)}</td>
              <td><button class="btn btn-ghost" data-view="${c.id}">View</button></td>
            </tr>`)
          .join('');
      }

      const totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
      document.getElementById('pager').innerHTML = `
        <button id="prevBtn" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
        <span>Page ${page} of ${totalPages} (${data.total} complaints)</span>
        <button id="nextBtn" ${page >= totalPages ? 'disabled' : ''}>Next ›</button>
      `;
      document.getElementById('prevBtn')?.addEventListener('click', () => { page--; load(); });
      document.getElementById('nextBtn')?.addEventListener('click', () => { page++; load(); });

      body.querySelectorAll('.statusSelect').forEach((sel) => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          sel.disabled = true;
          try {
            await apiRequest(`/api/admin/complaints/${id}`, { method: 'PATCH', body: { status: sel.value } });
          } catch (e) {
            alert(e.message);
          } finally {
            sel.disabled = false;
            load();
          }
        });
      });

      body.querySelectorAll('button[data-view]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const c = data.complaints.find((x) => x.id === btn.dataset.view);
          if (!c) return;
          showComplaintModal(c);
        });
      });
    } catch (e) {
      body.innerHTML = `<tr class="empty-row"><td colspan="7">${escapeHtml(e.message)}</td></tr>`;
    }
  }

  search.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { page = 1; load(); }, 350);
  });
  statusFilter.addEventListener('change', () => { page = 1; load(); });
  roleFilter.addEventListener('change', () => { page = 1; load(); });

  load();
</script>
</body>
</html>
