<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickFit4u Admin — Payments</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="shared.js"></script>
<script>
  renderShell('payments.html');
  setPageTitle('Payments');

  document.getElementById('mainContent').innerHTML = `
    <div id="statsGrid" class="stats-grid"><div class="loading">Loading stats…</div></div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by gym, member, booking code, or payment ID…">
      <input type="date" id="dateFilter">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="paid">Paid</option>
        <option value="created">Awaiting payment</option>
        <option value="failed">Failed</option>
      </select>
      <button class="btn btn-ghost" id="clearDate">Clear date</button>
    </div>
    <div class="section">
      <table>
        <thead><tr><th>Booking</th><th>Gym</th><th>Member</th><th>Amount</th><th>Status</th><th>Razorpay Payment ID</th><th>Date</th></tr></thead>
        <tbody id="paymentsBody"><tr class="empty-row"><td colspan="7" class="loading">Loading…</td></tr></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>
  `;

  let page = 1;
  let debounceTimer;
  const search = document.getElementById('search');
  const dateFilter = document.getElementById('dateFilter');
  const statusFilter = document.getElementById('statusFilter');

  document.getElementById('clearDate').addEventListener('click', () => {
    dateFilter.value = '';
    page = 1;
    load();
  });

  async function load() {
    const body = document.getElementById('paymentsBody');
    body.innerHTML = `<tr class="empty-row"><td colspan="7" class="loading">Loading…</td></tr>`;
    try {
      const params = new URLSearchParams({ page });
      if (search.value.trim()) params.set('search', search.value.trim());
      if (dateFilter.value) params.set('date', dateFilter.value);
      if (statusFilter.value) params.set('status', statusFilter.value);

      const data = await apiRequest('/api/admin/payments?' + params.toString());
      if (!data) return;

      document.getElementById('statsGrid').innerHTML = [
        ['Total Collected', '₹' + data.summary.totalCollectedRupees],
        ['Successful Payments', data.summary.paidCount],
        ['Failed Payments', data.summary.failedCount],
      ]
        .map(([label, value]) => `<div class="stat-card"><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`)
        .join('');

      if (data.payments.length === 0) {
        body.innerHTML = `<tr class="empty-row"><td colspan="7">No payments match.</td></tr>`;
      } else {
        body.innerHTML = data.payments
          .map((p) => {
            const statusLabel = p.status === 'created' ? 'awaiting payment' : p.status;
            return `<tr>
              <td>${escapeHtml(p.bookingCode)}</td>
              <td>${escapeHtml(p.gymName)}</td>
              <td>${escapeHtml(p.memberName)}<br><span style="color:var(--ink-soft);font-size:11.5px;">${escapeHtml(p.memberEmail)}</span></td>
              <td>₹${escapeHtml(String(p.amountRupees))}</td>
              <td><span class="pill pill-${escapeHtml(p.status)}">${escapeHtml(statusLabel)}</span></td>
              <td style="font-size:11.5px;color:var(--ink-soft);">${escapeHtml(p.razorpayPaymentId || '—')}</td>
              <td>${formatDateTime(p.createdAt)}</td>
            </tr>`;
          })
          .join('');
      }

      const totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
      document.getElementById('pager').innerHTML = `
        <button id="prevBtn" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
        <span>Page ${page} of ${totalPages} (${data.total} payments)</span>
        <button id="nextBtn" ${page >= totalPages ? 'disabled' : ''}>Next ›</button>
      `;
      document.getElementById('prevBtn')?.addEventListener('click', () => { page--; load(); });
      document.getElementById('nextBtn')?.addEventListener('click', () => { page++; load(); });
    } catch (e) {
      body.innerHTML = `<tr class="empty-row"><td colspan="7">${escapeHtml(e.message)}</td></tr>`;
    }
  }

  search.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { page = 1; load(); }, 350);
  });
  dateFilter.addEventListener('change', () => { page = 1; load(); });
  statusFilter.addEventListener('change', () => { page = 1; load(); });

  load();
</script>
</body>
</html>
