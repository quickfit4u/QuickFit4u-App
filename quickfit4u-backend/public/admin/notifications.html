<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickFit4u Admin — Notifications</title>
<link rel="stylesheet" href="shared.css">
<style>
  .broadcast-form { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 22px; margin-bottom: 26px; max-width: 520px; }
  .broadcast-form label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 6px; }
  .broadcast-form select, .broadcast-form input, .broadcast-form textarea {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 13.5px; font-family: inherit; margin-bottom: 16px; color: var(--ink);
  }
  .broadcast-form textarea { min-height: 90px; resize: vertical; }
  .success-banner { background: var(--sage-light); color: var(--sage-dark); padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
  renderShell('notifications.html');
  setPageTitle('Notifications');

  document.getElementById('mainContent').innerHTML = `
    <div class="broadcast-form">
      <div class="success-banner" id="successBanner"></div>
      <div class="error-banner" id="errorBanner" style="display:none; margin-bottom:16px;"></div>
      <form id="broadcastForm">
        <label>Send to</label>
        <select id="audience">
          <option value="all">Everyone</option>
          <option value="member">Members only</option>
          <option value="owner">Gym owners only</option>
        </select>
        <label>Title</label>
        <input id="title" required placeholder="e.g. Scheduled maintenance tonight">
        <label>Message (optional)</label>
        <textarea id="body" placeholder="Add more detail here…"></textarea>
        <button type="submit" class="btn btn-primary" id="sendBtn" style="padding:12px 22px;">Send Notification</button>
      </form>
    </div>

    <div class="section">
      <div class="section-head"><h2>Recently Sent</h2></div>
      <table>
        <thead><tr><th>Title</th><th>Audience</th><th>Recipients</th><th>Sent</th></tr></thead>
        <tbody id="sentBody"><tr class="empty-row"><td colspan="4" class="loading">Loading…</td></tr></tbody>
      </table>
    </div>
  `;

  const form = document.getElementById('broadcastForm');
  const successBanner = document.getElementById('successBanner');
  const errorBanner = document.getElementById('errorBanner');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    successBanner.style.display = 'none';
    errorBanner.style.display = 'none';
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';

    try {
      const result = await apiRequest('/api/admin/notifications/broadcast', {
        method: 'POST',
        body: {
          audience: document.getElementById('audience').value,
          title: document.getElementById('title').value,
          body: document.getElementById('body').value,
        },
      });
      successBanner.textContent = `Sent to ${result.recipientCount} user${result.recipientCount === 1 ? '' : 's'}.`;
      successBanner.style.display = 'block';
      form.reset();
      loadSent();
    } catch (err) {
      errorBanner.textContent = err.message;
      errorBanner.style.display = 'block';
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send Notification';
    }
  });

  async function loadSent() {
    const body = document.getElementById('sentBody');
    try {
      const data = await apiRequest('/api/admin/notifications/sent');
      if (!data) return;
      if (data.broadcasts.length === 0) {
        body.innerHTML = `<tr class="empty-row"><td colspan="4">No broadcasts sent yet.</td></tr>`;
        return;
      }
      body.innerHTML = data.broadcasts
        .map(
          (b) => `<tr>
            <td><strong>${escapeHtml(b.title)}</strong>${b.body ? '<br><span style="color:var(--ink-soft);font-size:11.5px;">' + escapeHtml(b.body) + '</span>' : ''}</td>
            <td>${escapeHtml(b.audience)}</td>
            <td>${b.recipientCount}</td>
            <td>${formatDateTime(b.createdAt)}</td>
          </tr>`
        )
        .join('');
    } catch (e) {
      body.innerHTML = `<tr class="empty-row"><td colspan="4">${escapeHtml(e.message)}</td></tr>`;
    }
  }

  loadSent();
</script>
</body>
</html>
