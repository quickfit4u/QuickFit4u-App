<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickFit4u Admin — Log In</title>
<style>
  :root {
    --sage: #7A9166; --sage-dark: #5E7A4E; --sage-light: #E7EEDF;
    --cream: #F5F1E6; --ink: #2B3328; --ink-soft: #6B7566;
    --gold: #C9A227; --line: rgba(43,51,40,0.15);
    --error-bg: #F7E3E1; --error-text: #B4463B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--cream); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 36px 32px;
    box-shadow: 0 10px 40px rgba(43,51,40,0.08); border: 1px solid var(--line);
  }
  .brand { font-size: 15px; font-weight: 700; color: var(--ink-soft); margin-bottom: 22px; letter-spacing: 0.3px; }
  h1 { font-size: 24px; color: var(--ink); margin: 0 0 6px; }
  p.sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 26px; line-height: 1.5; }
  label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 14px; margin-bottom: 16px; font-family: inherit; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--sage-dark); }
  button {
    width: 100%; padding: 14px; border-radius: 100px; border: none; background: var(--sage-dark);
    color: #fff; font-weight: 700; font-size: 14.5px; cursor: pointer; margin-top: 6px;
  }
  button:hover { background: var(--ink); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { display: none; background: var(--error-bg); color: var(--error-text); padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">QuickFit4u · Admin</div>
    <h1>Admin Login</h1>
    <p class="sub">Sign in with your admin account to manage the platform.</p>

    <div class="error" id="errorBox"></div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button type="submit" id="submitBtn">Log In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    
    if (localStorage.getItem('quickfit4u_admin_token')) {
      window.location.href = 'dashboard.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed.');

        if (data.user.role !== 'admin') {
          throw new Error('This account does not have admin access.');
        }

        localStorage.setItem('quickfit4u_admin_token', data.token);
        localStorage.setItem('quickfit4u_admin_name', data.user.name);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
